# Fork-only continuous deployment: every push to main redeploys the career-ops VM.
# GitHub OIDC -> AWS role (no stored keys) -> SSM Run Command (no inbound ports).
name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'alessandrodalbesio/career-ops'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      INSTANCE_ID: i-091012fe848548307
      AWS_REGION: eu-north-1
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::107866120340:role/career-ops-github-deploy
          aws-region: eu-north-1

      - name: Run deploy script on the VM via SSM
        run: |
          set -euo pipefail
          cat > params.json <<'JSON'
          {
            "commands": ["sudo -H -u ubuntu XDG_RUNTIME_DIR=/run/user/$(id -u ubuntu) bash -lc '~/career-ops-deploy.sh'"],
            "executionTimeout": ["1800"]
          }
          JSON
          cmd_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "deploy ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          status=Pending
          for _ in $(seq 1 220); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "Status: $status"
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          [ "$status" = "Success" ]
